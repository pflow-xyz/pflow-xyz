# Generator for parity/native/goldens.json: runs parity/native/cases.json through
# pflow-native's registry, natively (not wasm), exactly as the wasm Engine does
# (its own memory store, file.load_json unjournaled, then Session::execute). It
# is not part of the Go build or the Bazel graph (no .go files, no BUILD file)
# and has its own workspace so no parent Cargo workspace adopts it.
#
# The rev is the pflow-native commit the vendored wasm
# (public/vendor/pflow-native-wasm, pflow-native-wasm.lock) was built from; the
# two move together. `make native-goldens` regenerates.
[package]
name = "native-goldens"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
# default features: the same set as the wasm build (no services, http, zk, rnn, png).
pflow-native-core = { git = "https://github.com/pflow-xyz/pflow-native", rev = "5676bb068e7991f4baaee064f8f10a9ce4b5d9e7" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
