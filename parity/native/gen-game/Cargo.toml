# Generator for parity/native/game_goldens.json: runs the cases of
# parity/native/game_cases.json through pflow-native's game.value and
# game.move, natively, and writes what they answer. It is not part of the Go
# build or the Bazel graph, and has its own workspace so no parent Cargo
# workspace adopts it.
#
# Two pins move together here, and game_goldens.json records both:
#
# - pflow-native-core 7d3a972 (feat/portable-cr-pow): game.value and
#   game.move, with the root estimate "ode", the aspiration driver and
#   coloured nets.
# - pflow-rs a1c4b55aed9d1978f588b68ea5a82a985191bddf: what that pflow-native
#   pins, main (aacb7eb) plus pflow_solver::crmath, the correctly rounded pow
#   the ODE step control calls instead of the platform's powf. With it the
#   goldens are the same on every host: generated here (darwin/arm64) and on
#   Linux / x86_64 they are byte-identical, the wasm shim answers every case
#   the same (parity/native/wasm_game_check.mjs) and so does the Go port.
#   `make game-goldens PFLOW_RS=...` builds against a checkout instead.

[package]
name = "game-goldens"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
pflow-native-core = { git = "https://github.com/pflow-xyz/pflow-native", rev = "7d3a972ca33d57ebde04aebc6042804a07fd683e" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
