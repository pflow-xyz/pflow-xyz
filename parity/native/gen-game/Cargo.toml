# Generator for parity/native/game_goldens.json: runs the cases of
# parity/native/game_cases.json through pflow-native's game.value and
# game.move, natively, and writes what they answer. It is not part of the Go
# build or the Bazel graph, and has its own workspace so no parent Cargo
# workspace adopts it.
#
# Two pins move together here, and game_goldens.json records both:
#
# - pflow-native-core: the commit that has game.value and game.move. It is
#   newer than the wasm in pflow-native-wasm.lock (which has neither), so
#   these goldens are generated apart from goldens.json / mcp_goldens.json.
# - pflow-rs: pflow-native pins 9ce3d43, which is before pflow-rs' mtd_f
#   driver, the refusal of a repeated driver and the Zobrist key of the counts
#   engine. The search this port follows is pflow-rs at 35be807, so `make
#   game-goldens` patches every pflow-rs crate to a checkout of it (Cargo does
#   not take a patch to another revision of the same git URL).
[package]
name = "game-goldens"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
pflow-native-core = { git = "https://github.com/pflow-xyz/pflow-native", rev = "cdd3816106e64df93456c45900ef92550cbbb90c" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
