# Generator for parity/native/game_goldens.json: runs the cases of
# parity/native/game_cases.json through pflow-native's game.value and
# game.move, natively, and writes what they answer. It is not part of the Go
# build or the Bazel graph, and has its own workspace so no parent Cargo
# workspace adopts it.
#
# Two pins move together here, and game_goldens.json records both:
#
# - pflow-native-core: the commit that has game.value and game.move, with the
#   root estimate "ode", the aspiration driver and coloured nets. It is newer
#   than the wasm in pflow-native-wasm.lock (which has neither command), so
#   these goldens are generated apart from goldens.json / mcp_goldens.json.
# - pflow-rs 35be80745784e9ed0375103bfc035ffcfcfaeb2c: what that pflow-native
#   pins (it has the mtd_f driver, the refusal of a repeated driver, the
#   counts engine's Zobrist key and pflow_solver::game::OdeEstimate). Its
#   Cargo.lock names the same revision. pflow-rs main (e7fe9a3) differs from it
#   only in docs/search-pieces-roadmap.md; `make game-goldens PFLOW_RS=...`
#   builds against a checkout instead, to try that or another.
[package]
name = "game-goldens"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
pflow-native-core = { git = "https://github.com/pflow-xyz/pflow-native", rev = "cc2c63b2ece5fefddf3f3c65e2103d1e4724d0f3" }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
