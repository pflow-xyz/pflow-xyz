name: Test

# The job below is named `test` on purpose. The deploy webhook on pflow.dev
# (cmd/webserver/deploy.go, docs/deploy.md) will not ship a commit on main until
# GitHub reports a successful check run with exactly that name for it. Renaming
# the job means setting DEPLOY_CI_CHECK on the box in the same change.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A superseded pull-request run is cancelled. A run on main never is: the deploy
# gate needs a completed result for every sha it may be asked about, so each
# push to main gets a group of its own.
concurrency:
  group: test-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      # test-parity and test-npm-pack shell out to node/npm.
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      # Stages public/ into internal/static (the Go embed, which `go test ./...`
      # needs) and builds bin/webserver, as the deploy does.
      - name: Build
        run: make build

      # Everything the Makefile calls a test: test-js, test-parity,
      # test-parity-behavior, test-publish, test-npm-pack, test-theme,
      # test-version and `go test ./...`. New test files are added to the
      # Makefile's lists, not to this file.
      - name: Test
        run: make test
