<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Composition views · pflow.xyz</title>
  <meta name="description" content="One composition drawn in ten categorical and Petri-net conventions, every link and plan rule decided by pflow-native's registry (wasm).">
  <meta name="author" content="Matt York">
  <link rel="me" href="https://github.com/stackdump">
  <link rel="me" href="https://blog.stackdump.com/">
  <link rel="icon" href="/favicon-32x32.png">
  <link rel="stylesheet" href="compose/compose.css">
  <script type="module" src="compose/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <a href="/" class="home" title="back to the pflow.xyz editor">pflow.xyz</a>
      <b>composition views</b>
      <span class="muted">one composition, many conventions · every link rule, Flatten and run is pflow-native's registry (pflow-compose); every plan rule is pflow-rs's</span>
    </div>
    <div class="examples">
      <button id="ex-orders" class="seg">orders / workers / refund</button>
      <button id="ex-connect4" class="seg">connect-4 exact plan</button>
    </div>
    <nav id="tabs" class="tabs"></nav>
  </header>
  <main class="layout">
    <section class="stage-wrap">
      <div id="toolbar" class="toolbar"></div>
      <div id="flash" class="flash-banner"></div>
      <div id="stage" class="stage"></div>
      <div id="snap-status" class="snap-status"></div>
    </section>
    <aside class="side">
      <section id="convention" class="card"></section>
      <section class="card"><h3>Inspector</h3><div id="inspector-body"></div></section>
      <section id="rules" class="card"></section>
      <section id="composition" class="card"></section>
      <section id="receipts" class="card"></section>
    </aside>
  </main>
  <noscript>This page draws everything with JavaScript, and runs pflow-native's registry as WebAssembly.</noscript>
</body>
</html>
