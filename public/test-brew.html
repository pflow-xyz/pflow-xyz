    <script type="module">
        const pv = document.getElementById('pv');
        
        // Wait for the component to initialize
        setTimeout(() => {
            const model = pv.getModel();
            console.log('Model:', model);
            
            // Get the current marking
            const marks = pv._marking();
            console.log('Current marking:', marks);
            
            // Check if BrewCoffee is enabled
            const enabled = pv._enabled('BrewCoffee', marks);
            console.log('BrewCoffee enabled:', enabled);
            
            // Check each input arc
            const inArcs = pv._inArcsOf('BrewCoffee');
            console.log('Input arcs to BrewCoffee:', inArcs);
            
            inArcs.forEach(arc => {
                const weight = pv._getArcWeight(arc);
                const tokens = marks[arc.source];
                console.log(`Arc from ${arc.source}: weight=${JSON.stringify(weight)}, tokens=${JSON.stringify(tokens)}`);
            });
        }, 1000);
    </script>
