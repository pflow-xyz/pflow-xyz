    <style>
        :root {
            /* Aliases onto the shared brand palette in petri-view.css. The
               values live there so a light variant of this page is a
               values-only change; --pf-* names stay for the markup below. */
            --pf-bg: var(--pv-brand-bg);
            --pf-bg-alt: var(--pv-brand-bg-alt);
            --pf-bg-card: var(--pv-brand-bg-card);
            --pf-text: var(--pv-brand-ink);
            --pf-text-muted: var(--pv-brand-ink-muted);
            --pf-accent: var(--pv-brand-accent);
            --pf-accent-hover: var(--pv-brand-accent-hover);
            --pf-border: var(--pv-brand-border);
            --pf-radius: 4px;
        }

        /* Example cards: drawn from the #pf-examples template by the shell's Examples window (petri-shell-guide.js). */
        .model-grid {
            display: grid;
            /* three across: six examples fill two rows (four across left two orphans) */
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 24px;
        }
        @media (max-width: 900px) { .model-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
        @media (max-width: 560px) { .model-grid { grid-template-columns: 1fr; } }

        .model-card {
            background: var(--pf-bg-card);
            border: 1px solid var(--pf-border);
            border-radius: var(--pf-radius);
            overflow: hidden;
            transition: border-color 0.2s, transform 0.15s;
            color: var(--pf-text);
            display: flex;
            flex-direction: column;
        }

        .model-card:hover,
        .model-card:focus-within {
            border-color: var(--pf-accent);
            transform: translateY(-2px);
        }

        .model-card-main {
            display: block;
            flex: 1;
            color: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        .model-card-opens {
            display: inline-block;
            margin-top: 10px;
            padding: 3px 10px;
            border: 1px solid var(--pf-accent);
            border-radius: 12px;
            font-size: 0.78rem;
            line-height: 1.35;
            color: var(--pf-text);
        }

        .model-card-canvas {
            display: block;
            padding: 10px 16px 14px;
            font-size: 0.8rem;
            color: var(--pf-text-muted);
            text-decoration: none;
        }

        .model-card-canvas:hover {
            color: var(--pf-accent);
            text-decoration: underline;
        }

        .model-card-img {
            width: 100%;
            height: 180px;
            background: var(--pv-paper);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border-bottom: 1px solid var(--pf-border);
        }

        .model-card-img { padding: 10px; background: color-mix(in srgb, var(--pf-bg-card) 88%, white); }
        .model-card-img img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 10px;
            background: var(--pv-paper);
            border-radius: 8px;
            box-shadow: 0 0 0 1px var(--pf-border);
        }

        .model-card-body {
            padding: 16px;
        }

        .model-card-body h3 {
            font-size: 1rem;
            font-weight: 600;
            margin: 0 0 6px;
        }

        .model-card-body p {
            font-size: 0.85rem;
            color: var(--pf-text-muted);
            margin: 0;
            line-height: 1.4;
        }

        .model-grid { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        @media (max-width: 640px) { .model-grid { grid-template-columns: 1fr; } }

        /* Editor chrome (when visible) */
        .fixed-title {
            position: fixed;
            top: 16px;
            left: 60px;
            width: 120px;
            height: auto;
            z-index: 1000;
            pointer-events: auto;
        }

        .fixed-title img {
            width: 100%;
            height: auto;
            display: block;
            pointer-events: none;
        }

        .hamburger-placeholder {
            position: fixed;
            top: 10px;
            left: 10px;
            width: 40px;
            height: 40px;
            z-index: 1000;
            pointer-events: none;
        }
    </style>
</head>
<body>
